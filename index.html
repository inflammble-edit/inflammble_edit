<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이하은 — Film Editor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- 헤더 -->
    <header class="intro">
      <h1 class="intro__name">이하은</h1>
      <p class="intro__role">Film Editor <span class="intro__dim">— Seoul, Korea</span></p>
      <p class="intro__statement">
        장편, 다큐멘터리, 예고편을 오가며 이야기의 리듬을 찾는 편집자입니다.
        컷과 컷 사이의 호흡으로 감정을 설계합니다.
      </p>
      <ul class="intro__contact">
        <li><a href="mailto:haeun.lee.edit@example.com">haeun.lee.edit@example.com</a></li>
        <li><a href="#" target="_blank" rel="noopener">IMDb</a></li>
        <li><a href="#" target="_blank" rel="noopener">Vimeo</a></li>
      </ul>
    </header>

    <!-- 역할 필터 -->
    <nav class="filter" aria-label="역할 필터">
      <ul class="filter__list" id="filterList">
        <!-- JS로 채워짐 -->
      </ul>
    </nav>

    <!-- 작품 목록 -->
    <main>
      <ul class="list" id="workList">
        <!-- JS로 채워짐 -->
      </ul>
      <p class="list__empty" id="emptyState" hidden>해당 역할로 참여한 작품이 아직 없습니다.</p>
    </main>

    <footer class="footer">
      <p>© 2024 Lee Haeun. 이 페이지의 작품 정보는 포트폴리오 예시입니다.</p>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
